name: Packagist

# Notifies Packagist to re-crawl the repo on every push/tag, so the package stays
# current without the GitHub webhook. Opt-in: the step is skipped unless the two
# secrets are set (PACKAGIST_USERNAME, PACKAGIST_TOKEN from your Packagist profile).
# Prefer Packagist's built-in GitHub integration? Delete this file and enable it there.
on:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
    steps:
      - name: Notify Packagist
        if: env.PACKAGIST_TOKEN != ''
        run: |
          curl -sfSL -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/fundistadi/fundi-postgis"}}'
          echo "Packagist notified."
